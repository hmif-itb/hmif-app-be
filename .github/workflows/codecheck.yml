name: codecheck

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize]

jobs:
  code-check:
    name: Run eslint and typescript check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run code check
        run: bun run check
